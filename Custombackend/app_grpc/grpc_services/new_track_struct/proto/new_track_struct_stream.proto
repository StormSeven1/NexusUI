message TargetObject {
  string target_id = 1;
  string name = 2;
  string description = 3;
  repeated AlternateId alternate_ids = 4;
  string external_target_id = 5;
  EntityRef target_board = 6;
  string group_id = 7;
  TargetState state = 8;
  KillChainState kill_chain_state = 9;
  double existence_confidence = 10;
  int32 lost_frame_count = 11;
  double created_time = 12;
  double last_update_time = 13;
  UnitType classified_type = 14;
  double type_confidence = 15;
  FriendFoeType friend_foe = 16;
  RealityType reality_type = 17;
  EnvironmentType environment = 18;
  double fused_azimuth_deg = 19;
  double fused_elevation_deg = 20;
  double fused_range_m = 21;
  Kinematics target_kinematics = 22;
  TargetPriorityInfo priority = 23;
  repeated SignalInfo signals = 24;
  repeated Aimpoint aimpoints = 25;
  repeated DetectionReasoning detection_reasonings = 26;
  repeated TargetSourceItem sources = 27;
  TargetCorrelationInfo correlation = 28;
  SecurityMarking security = 29;
  repeated StateHistoryRecord state_history = 30;
  repeated EvidenceEvent evidence_chain = 31;
  repeated TargetAlarmItem alarms = 32;
}

message TargetOutputSet {
  repeated TargetObject targets = 1;
  repeated GroupObject groups = 2;
}

service NewTrackStructStreamService {
  rpc Subscribe(SubscribeNewTrackStructRequest) returns (stream TargetOutputSet);
}
