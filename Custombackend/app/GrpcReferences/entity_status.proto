// ==================== 无人机状态消息 ====================

message SdrNode {
    int32 sdr_id = 1;
    string sn = 2;

    reserved 3;
}

message ControlSourceNode {
    int32 sdr_id = 1;
    string sn = 2;
    int32 control_source_index = 3;

    reserved 4;
}

message WirelessLinkTopoInDrone {
    bytes secret_code = 1;
    SdrNode center_node = 2;
    repeated ControlSourceNode leaf_nodes = 3;

    reserved 4;
}

message LiveviewWorldRegion {
    float left = 1;
    float top = 2;
    float right = 3;
    float bottom = 4;

    reserved 5;
}

message DroneTemperaturePoint {
    double x = 1;
    double y = 2;
    double temperature = 3;

    reserved 4;
}

message IrMeteringArea {
    double x = 1;
    double y = 2;
    double width = 3;
    double height = 4;
    double aver_temperature = 5;
    DroneTemperaturePoint min_temperature_point = 6;
    DroneTemperaturePoint max_temperature_point = 7;

    reserved 8;
}

message DroneEsimInfo {
    DroneTelecomOperator telecom_operator = 1;
    bool enabled = 2;
    string iccid = 3;

    reserved 4;
}

message DroneSimInfo {
    DroneTelecomOperator telecom_operator = 1;
    DroneSimType sim_type = 2;
    string iccid = 3;

    reserved 4;
}

message DongleInfoInDrone {
    string imei = 1;
    DongleTypeInDrone dongle_type = 2;
    string eid = 3;
    EsimActivateState esim_activate_state = 4;
    DroneSimCardState sim_card_state = 5;
    DroneSimSlot sim_slot = 6;
    repeated DroneEsimInfo esim_infos = 7;
    DroneSimInfo sim_info = 8;

    reserved 9 to 15;
}

message MaintainStatusItemInDrone {
    int32 state = 1;
    int32 last_maintain_type = 2;
    int64 last_maintain_time = 3;
    int32 last_maintain_flight_time = 4;
    int32 last_maintain_flight_sorties = 5;

    reserved 6;
}

message MaintainStatusInDrone {
    repeated MaintainStatusItemInDrone maintain_status_array = 1;

    reserved 2;
}

message TypeSubtypeGimbalIndex {
    double gimbal_pitch = 1;
    double gimbal_roll = 2;
    double gimbal_yaw = 3;
    string payload_index = 4;
    double zoom_factor = 5;

    reserved 6;
}

message PositionStateInDrone {
    PositionFixedStatus is_fixed = 1;
    DronePositionQuality quality = 2;
    int32 gps_number = 3;
    int32 rtk_number = 4;

    reserved 5;
}

message StorageInfo {
    int32 total = 1;
    int32 used = 2;

    reserved 3;
}

message DroneBatteryInfo {
    int32 capacity_percent = 1;
    int32 index = 2;
    string sn = 3;
    int32 type = 4;
    int32 sub_type = 5;
    string firmware_version = 6;
    int32 loop_times = 7;
    int32 voltage = 8;
    float temperature = 9;
    int32 high_voltage_storage_days = 10;

    reserved 11, 12;
}

message DroneBatteryStatus {
    int32 capacity_percent = 1;
    int32 remain_flight_time = 2;
    int32 return_home_power = 3;
    int32 landing_power = 4;
    repeated DroneBatteryInfo batteries = 5;

    reserved 6;
}

message DroneObstacleAvoidance {
    ObstacleAvoidanceState horizon = 1;
    ObstacleAvoidanceState upside = 2;
    ObstacleAvoidanceState downside = 3;

    reserved 4;
}

