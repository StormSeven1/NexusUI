    int32 height_limit = 13;
    int32 night_lights_state = 14;
    int64 activation_time = 15;
    MaintainStatusInDrone maintain_status = 16;
    int32 total_flight_sorties = 17;
    TypeSubtypeGimbalIndex type_subtype_gimbalindex = 18;
    string track_id = 19;
    PositionStateInDrone position_state = 20;
    StorageInfo storage = 21;
    DroneBatteryStatus battery = 22;
    float total_flight_distance = 23;
    int32 total_flight_time = 24;
    int32 serious_low_battery_warning_threshold = 25;
    int32 low_battery_warning_threshold = 26;
    string control_source = 27;
    WindDirection wind_direction = 28;
    float wind_speed = 29;
    float home_distance = 30;
    double home_latitude = 31;      // 改为 double
    double home_longitude = 32;     // 改为 double
    int32 attitude_head = 33;
    float attitude_roll = 34;
    float attitude_pitch = 35;
    float elevation = 36;
    float height = 37;
    double latitude = 38;           // 改为 double
    double longitude = 39;          // 改为 double
    float vertical_speed = 40;
    float horizontal_speed = 41;
    int32 firmware_upgrade_status = 42;
    int32 compatible_status = 43;
    string firmware_version = 44;
    GearMode gear = 45;
    ModeCodeReason mode_code_reason = 46;
    float commander_flight_height = 47;
    int32 commander_flight_mode = 48;
    int32 commander_mode_lost_action = 49;
