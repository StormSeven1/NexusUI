}

enum IsWithMaintenance {
    MAINTENANCE_WITHOUT = 0;
    MAINTENANCE_WITH = 1;
}

enum AircraftMaintenanceLevel {
    AIRCRAFT_MAINTENANCE_NONE = 0;
    AIRCRAFT_MAINTENANCE_REGULAR = 1;
    AIRCRAFT_MAINTENANCE_DEEP = 2;
}

// ==================== 机场状态消息 ====================

// RTK标定源
message RTCMInfo {
    string mount_point = 1;
    string port = 2;
    string host = 3;
    RTCMDeviceType rtcm_device_type = 4;
    CalibrationType source_type = 5;

    reserved 6 to 10;
}

// 飞行器对频信息
message CenterNode {
    uint32 sdr_id = 1;
    string sn = 2;

    reserved 3 to 5;
}

// 机场或遥控器对频信息
message LeafNode {
    uint32 sdr_id = 1;
    string sn = 2;
    uint32 control_source_index = 3;

    reserved 4, 5;
}

// 图传连接拓扑
message WirelessLinkTopoInDock {
    repeated uint32 secret_code = 1;
    CenterNode center_node = 2;
    repeated LeafNode leaf_nodes = 3;

    reserved 4, 5;
}

// 机场空调工作状态
message AirConditioner {
    AirConditionerState air_conditioner_state = 1;
    uint32 switch_time = 2;

    reserved 3, 4;
}

// eSIM信息
message ESIMInfo {
    TelecomOperator telecom_operator = 1;
    bool enabled = 2;
    string iccid = 3;

    reserved 4, 5;
}

// SIM卡信息
message SIMInfo {
    TelecomOperator telecom_operator = 1;
    SIMType sim_type = 2;
    string iccid = 3;

    reserved 4, 5;
}

// 4G Dongle信息
message DongleInfoInDock {
    string imei = 1;
    DongleTypeInDock dongle_type = 2;
    string eid = 3;
    ESIMActivationState esim_activate_state = 4;
    SIMCardState sim_card_state = 5;
    SIMSlot sim_slot = 6;
    repeated ESIMInfo esim_infos = 7;
    SIMInfo sim_info = 8;

    reserved 9 to 15;
}

// 电池详细信息
message DockBattery {
    uint32 capacity_percent = 1;
    uint32 index = 2;
    uint32 voltage = 3;
    double temperature = 4;

    reserved 5, 6;
}

// 飞行器电池保养信息
message DroneBatteryMaintenanceInfo {
    MaintenanceState maintenance_state = 1;
    uint32 maintenance_time_left = 2;
    HeatState heat_state = 3;
    repeated DockBattery batteries = 4;

    reserved 5 to 8;
}

// 保养信息子项
message MaintainStatusItemInDock {
    IsWithMaintenance state = 1;
    AircraftMaintenanceLevel last_maintain_type = 2;
    int64 last_maintain_time = 3;
    uint32 last_maintain_work_sorties = 4;

    reserved 5, 6;
}

// 保养信息
message MaintainStatusInDock {
    repeated MaintainStatusItemInDock maintain_status_array = 1;

    reserved 2;
}

// 搜星状态
message PositionStateInDock {
    uint32 is_calibration = 1;
    uint32 is_fixed = 2;
    SatelliteQuality quality = 3;
    uint32 gps_number = 4;
    uint32 rtk_number = 5;

    reserved 6, 7;
}

// 飞行器充电状态
message DroneChargeState {
    uint32 capacity_percent = 1;
    ChargingState state = 2;

    reserved 3;
}

// 备用电池
message BackupBattery {
    uint32 switch_state = 1;
    uint32 voltage = 2;
    double temperature = 3;

    reserved 4;
}

// 备降点
message AlternateLandPoint {
    double longitude = 1;
    double latitude = 2;
    double safe_land_height = 3;
    uint32 is_configured = 4;
    double height = 5;

    reserved 6;
}

// 存储容量
message StorageCapacity {
    uint32 total = 1;
    uint32 used = 2;

    reserved 3;
}

// 视频列表
message VideoList {
    string video_index = 1;
    string video_type = 2;
    repeated string switchable_video_types = 3;

    reserved 4;
}

// 相机列表
message CameraList {
    string camera_index = 1;
    uint32 available_video_number = 2;
    uint32 coexist_video_number_max = 3;
    repeated VideoList video_list = 4;

    reserved 5;
}

// 设备列表
message DeviceList {
    string sn = 1;
    uint32 available_video_number = 2;
    uint32 coexist_video_number_max = 3;
    repeated CameraList camera_list = 4;

    reserved 5;
}

// 直播能力
message LiveCapacity {
    uint32 available_video_number = 1;
    uint32 coexist_video_number_max = 2;
    repeated DeviceList device_list = 3;

    reserved 4;
}

// 直播状态项
message LiveStatusItem {
    string video_id = 1;
    string video_type = 2;
    VideoQuality video_quality = 3;
    LiveStreamingState status = 4;
    uint32 error_status = 5;

    reserved 6;
}

// 直播状态
message LiveStatus {
    repeated LiveStatusItem live_status = 1;

    reserved 2;
}

// 图传链路
message WirelessLink {
    uint32 dongle_number = 1;
    LinkState four_g_link_state = 2;
    LinkState sdr_link_state = 3;
    LinkWorkMode link_workmode = 4;
    uint32 sdr_quality = 5;
    uint32 four_g_quality = 6;
    uint32 four_g_uav_quality = 7;
    uint32 four_g_gnd_quality = 8;
    double sdr_freq_band = 9;
    double four_g_freq_band = 10;

    reserved 11 to 15;
}

// 媒体文件上传细节
message MediaFileDetail {
    uint32 remain_upload = 1;

    reserved 2;
}

// 网络状态
message NetworkState {
    NetworkType type = 1;
    NetworkQuality quality = 2;
    double rate = 3;

    reserved 4;
}

// 子设备状态
message SubDevice {
    string device_sn = 1;
    string device_model_key = 2;
    DeviceOnlineStatus device_online_status = 3;
    DevicePairedStatus device_paired = 4;

    reserved 5;
}

// 机场实时状态
message Dock2RealTimeStatus {
    BaseDeviceStatus base = 1;
    HomePositionValidity home_position_is_valid = 2;
    double heading = 3;
    RTCMInfo rtcm_info = 4;
    WirelessLinkTopoInDock wireless_link_topo = 5;
    AirConditioner air_conditioner = 6;
    bool air_transfer_enable = 7;
    SilentMode silent_mode = 8;
    UserExperienceImprovement user_experience_improvement = 9;
    repeated DongleInfoInDock dongle_infos = 10;
    DroneBatteryMaintenanceInfo drone_battery_maintenance_info = 11;
    MaintainStatusInDock maintain_status = 12;
    PositionStateInDock position_state = 13;
    EmergencyStopState emergency_stop_state = 14;
    DroneChargeState drone_charge_state = 15;
    BackupBattery backup_battery = 16;
    uint32 alarm_state = 17;
    BatteryStoreMode battery_store_mode = 18;
    int64 activation_time = 19;
    double height = 20;
    AlternateLandPoint alternate_land_point = 21;
    FirmwareConsistency compatible_status = 22;
    int64 acc_time = 23;
    int64 first_power_on = 24;
    StorageCapacity storage = 25;
    double working_current = 26;
    uint32 working_voltage = 27;
    double humidity = 28;
    double temperature = 29;
    double environment_temperature = 30;
    double wind_speed = 31;
    Rainfall rainfall = 32;
    LiveCapacity live_capacity = 33;
    LiveStatus live_status = 34;
    WirelessLink wireless_link = 35;
    MediaFileDetail media_file_detail = 36;
    uint32 job_number = 37;
    bool drone_in_dock = 38;
    NetworkState network_state = 39;
    SupplementaryLightState supplement_light_state = 40;
    CoverState cover_state = 41;
    SubDevice sub_device = 42;
    FlightTaskStepCode flighttask_step_code = 43;
    DockModeCode mode_code = 44;
    FirmwareUpgradeStatus firmware_upgrade_status = 45;
    string firmware_version = 46;
    double latitude = 47;
    double longitude = 48;
    string dock_sn = 49;

    reserved 50 to 63;
}

// ==================== 无人机任务状态枚举 ====================

enum TemplateType {
    WAYPOINT = 0;
    MAPPING_2D = 1;
    MAPPING_3D = 2;
    MAPPING_STRIP = 3;
}

enum DroneType {
    DRONE_TYPE_M3D_M3TD = 0;
}

enum PayloadPosition {
    PAYLOAD_POSITION_0 = 0;
}

enum FinishAction {
    FINISH_ACTION_GO_HOME = 0;
    FINISH_ACTION_NO_ACTION = 1;
    FINISH_ACTION_AUTO_LAND = 2;
    FINISH_ACTION_GOTO_FIRST_WAYPOINT = 3;
}

enum RCLostAction {
    RC_LOST_ACTION_GO_BACK = 0;
    RC_LOST_ACTION_LANDING = 1;
    RC_LOST_ACTION_HOVER = 2;
}

enum WaypointHeadingMode {
    WAYPOINT_HEADING_FOLLOW_WAYLINE = 0;
    WAYPOINT_HEADING_MANUALLY = 1;
    WAYPOINT_HEADING_FIXED_YAW = 2;
    WAYPOINT_HEADING_SMOOTH_TRANSITION = 3;
    WAYPOINT_HEADING_TOWARD_POI = 4;
}

enum WaypointTurnMode {
    WAYPOINT_TURN_COORDINATE_TURN = 0;
    WAYPOINT_TURN_STOP_DISCONTINUOUS = 1;
    WAYPOINT_TURN_STOP_CONTINUOUS = 2;
    WAYPOINT_TURN_PASS_CONTINUOUS = 3;
}

enum GimbalPitchMode {
    GIMBAL_PITCH_MANUAL = 0;
    GIMBAL_PITCH_USE_POINT_SETTING = 1;
}

enum ActionTriggerType {
    ACTION_TRIGGER_REACH_POINT = 0;
    ACTION_TRIGGER_BETWEEN_POINTS = 1;
    ACTION_TRIGGER_MULTIPLE_TIMING = 2;
    ACTION_TRIGGER_MULTIPLE_DISTANCE = 3;
}

// ==================== 无人机任务状态消息 ====================

message WaypointHeadingParam {
    WaypointHeadingMode waypoint_heading_mode = 1;
    double waypoint_heading_angle = 2;
    string waypoint_poi_point = 3;

    reserved 4;
}

message WaypointTurnParam {
    WaypointTurnMode waypoint_turn_mode = 1;
    double waypoint_turn_damping_dist = 2;
    int64 use_straight_line = 3;

    reserved 4;
}

message TaskAction {
    int64 action_index = 1;
    int64 hover_time = 2;
    double aircraft_heading = 3;
    int64 use_global_image_format = 4;
    string image_format = 5;
    double gimbal_yaw_rotate_angle = 6;
    double gimbal_pitch_rotate_angle = 7;
    double zoom = 8;

    reserved 9, 10;
}

message ActionTriggerParam {
    ActionTriggerType action_trigger_type = 1;
    double action_trigger_param = 2;

    reserved 3;
}

message Waypoint {
    int64 index = 1;
    double latitude = 2;
    double longitude = 3;
    double height = 4;
    double speed = 5;
    WaypointHeadingParam heading_param = 6;
    WaypointTurnParam turn_param = 7;
    double gimbal_pitch_angle = 8;
    repeated TaskAction actions = 9;
    ActionTriggerParam action_trigger_param = 10;

    reserved 11, 12;
}

message SearchArea {
    string area_name = 1;
    repeated Waypoint area_points = 2;

    reserved 3;
}

message GenerateArea {
    string area_name = 1;
    repeated Waypoint area_points = 2;

    reserved 3;
}

message Wayline {
    string wayline_id = 1;
    string wayline_name = 2;
    TemplateType template_type = 3;
    DroneType drone_type = 4;
    int64 sub_drone_type = 5;
    string payload_type = 6;
    PayloadPosition payload_position = 7;
    string image_format = 8;
    FinishAction finish_action = 9;
    RCLostAction execute_rc_lost_action = 10;
    double global_height = 11;
    double auto_flight_speed = 12;
    GimbalPitchMode gimbal_pitch_mode = 13;
    string take_off_ref_point = 14;
    WaypointHeadingParam global_waypoint_heading_param = 15;
    WaypointTurnParam global_waypoint_turn_param = 16;
    repeated Waypoint way_point_list = 17;

    reserved 18 to 23;
}

// 弹药数量
message Munition {
    string munition_id = 1;
    string name = 2;
    int32 quantity_units = 3;

    reserved 4;
}

// 无人机任务实时状态
message DroneTaskRealTimeStatus {
    BaseDeviceStatus base = 1;
    Wayline current_wayline = 2;
    SearchArea current_search_area = 3;
    GenerateArea current_generate_area = 4;
    Munition munition_info = 5;
    string drone_state = 6;
    string drone_task_action = 7;
    string drone_task_target_id = 8;

    reserved 9 to 15;
}

// ==================== 无人机状态枚举 ====================

enum DroneCameraMode {
    DRONE_CAMERA_PHOTO_MODE = 0;
    DRONE_CAMERA_VIDEO_MODE = 1;
    DRONE_CAMERA_SMART_LOW_LIGHT = 2;
    DRONE_CAMERA_PANORAMA_MODE = 3;
