    repeated string photo_storage_settings = 12;
    repeated string video_storage_settings = 13;
    WideExposureMode wide_exposure_mode = 14;
    int32 wide_iso = 15;
    int32 wide_shutter_speed = 16;
    int32 wide_exposure_value = 17;
    WideExposureMode zoom_exposure_mode = 18;
    int32 zoom_iso = 19;
    int32 zoom_shutter_speed = 20;
    int32 zoom_exposure_value = 21;
    ZoomFocusMode zoom_focus_mode = 22;
    int32 zoom_focus_value = 23;
