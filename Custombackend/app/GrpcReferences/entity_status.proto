syntax = "proto3";

package entityStatusPkg;

// ==================== 服务定义 ====================

// 实体状态订阅服务（设备作为服务端，推送数据给订阅者）
service EntityStatusService {
    // 订阅设备实时状态（服务端流）
    // 客户端发起订阅请求，服务端（设备）持续推送状态
    rpc EntityStatusMethod(EntityStatusRequest) returns (stream EntityStatusResponse);
}

// ==================== 实时状态上报 ====================
// 客户端订阅请求
message EntityStatusRequest {}

// 服务端发布响应（服务端 -> 客户端）
message EntityStatusResponse {
    // 设备实时状态（oneof 选择一种）
    oneof status {
        CameraRealTimeStatus camera_real_time_status = 1;
        DroneRealTimeStatus drone_real_time_status = 2;
        Dock2RealTimeStatus dock_real_time_status = 3;
        USVRealTimeStatus usv_real_time_status = 4;
        RadarRealTimeStatus radar_real_time_status = 5;
        ModelRealTimeStatus model_real_time_status = 6;
        DroneTaskRealTimeStatus drone_task_real_time_status = 7;
        HighFreqRealTimeStatus high_freq_real_time_status = 8;
		JammerRealTimeStatus jammer_real_time_status = 9;
        LaserRealTimeStatus laser_real_time_status = 10;
        MunitionRealTimeStatus munition_real_time_status = 11;
        WeaponRealTimeStatus weapon_real_time_status = 12;
    }
}


// ==================== 基础枚举 ====================

// 执行状态枚举
enum ExecutionState {
    EXECUTING = 0;
    COMPLETED = 1;
    ALREADY_CLEARED = 2;
    SAVED = 3;
    FAILED = 4;
}

// 实体类型枚举
enum EntityType {
    CAMERA = 0;
    UAV = 1;
    DOCK = 2;
    USV = 3;
    RADAR = 4;
    TRACK = 5;
    MODEL = 6;
    JAMMER = 7;
    LASER = 8;
    MUNITION = 9;
    WEAPON = 10;
}

// 实体敌我属性
enum DispositionType {
    DISPOSITION_FRIENDLY = 0;
    DISPOSITION_HOSTILE = 1;
    DISPOSITION_NEUTRAL = 2;
	DISPOSITION_UNKNOWN = 3;
}

// 设备状态枚举
enum DeviceState {
    DEVICE_STATE_STANDBY = 0;
    DEVICE_STATE_POWERED = 1;
    DEVICE_STATE_EXECUTING = 2;
	DEVICE_STATE_UNKNOWN = 3;
}

// ==================== 基础消息 ====================

// 地理位置（使用 double 保证精度）
message GeoPosition {
    double longitude = 1;   // 经度
    double latitude = 2;    // 纬度
    double altitude = 3;    // 高度（米）
}

// 基础设备状态
message BaseDeviceStatus {
    EntityType entity_type = 1;
    string entity_id = 2;
    bool is_virtual_weapon = 3;
    DispositionType disposition_type = 4;
    uint32 target_id = 5;
    string target_name = 6;
    EntityType target_type = 7;
    string task_type = 8;
    ExecutionState execution_state = 9;
    uint32 execution_time_ms = 10;
    bool online = 11;
    GeoPosition position = 12;
    double elec = 13;
    string timestamp = 14;
    DeviceState device_state = 15;

    reserved 16 to 31;
}

// ==================== 相机状态 ====================

// 云台状态
message PTZStatus {
    double pan = 1;   // 水平角度
    double tilt = 2;  // 垂直角度
    double zoom = 3;  // 变焦倍数
}

// 视场角状态
message FOVStatus {
    double horizontal = 1;  // 水平视场角
    double vertical = 2;    // 垂直视场角
}

// 相机实时状态
message CameraRealTimeStatus {
    BaseDeviceStatus base = 1;
    PTZStatus ptz = 2;
    PTZStatus origin_ptz = 3;
    double focus = 4;
    FOVStatus fov = 5;
    double pano_offset = 6;
    int64 track_id = 7;
    double visibility = 8;
    double speed_param = 9;
    double root_pos = 10;

    reserved 11 to 20;
}

// ==================== 模型状态 ====================

// 模型工作状态枚举
enum ModelWorkingState {
    MODEL_IDLE = 0;
    INITIALIZING = 1;
    RUNNING = 2;
    PAUSED = 3;
    MODEL_ERROR = 4;
}

// 资源使用状态
message ResourceUsage {
    double cpu_usage_percent = 1;
    double gpu_usage_percent = 2;
    uint32 memory_usage_mb = 3;
    uint32 gpu_memory_usage_mb = 4;
    uint32 disk_usage_mb = 5;
    double network_bandwidth_mbps = 6;

    reserved 7 to 15;
}

// 模型实时状态
message ModelRealTimeStatus {
    BaseDeviceStatus base = 1;
    ModelWorkingState working_state = 2;
    string error_message = 3;
    ResourceUsage model_resource_usage = 4;

    reserved 5 to 10;
}

// ==================== 雷达状态 ====================

// 雷达实时状态
message RadarRealTimeStatus {
    BaseDeviceStatus base = 1;
    uint32 radar_id = 2;
    uint32 radar_type = 3;
    string radar_name = 4;
    double longitude = 5;
    double latitude = 6;
    uint32 transmit = 7;
    uint32 range = 8;
    uint32 pulse_width = 9;
    uint32 azi_offset = 10;
    uint32 range_offset = 11;
    uint32 sample_rate = 12;
    uint32 gain = 13;
    uint32 sea_clutter = 14;
    uint32 rain_clutter = 15;
    uint32 inhibit1 = 16;
    uint32 inhibit1_start_azi = 17;
    uint32 inhibit1_end_azi = 18;
    uint32 inhibit2 = 19;
    uint32 inhibit2_start_azi = 20;
    uint32 inhibit2_end_azi = 21;

    reserved 22 to 31;
}

// ==================== 机场状态枚举 ====================

